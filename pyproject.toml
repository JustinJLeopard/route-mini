[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "route-mini"
version = "0.1.0"
description = "Minimal reference for multi-provider LLM routing with fallback, budget, latency targets, and decision logging"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Justin Leopard" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy",
  "pytest",
  "pytest-cov",
  "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/route_mini"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "examples"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
